log_level: info

postgres:
  connection_string_env: DATABASE_URL
  pool_max_connections: 10

rpc:
  archive:
    url_env: CHAINSTACK_RPC_URL
    rate_limit_rps: 500
    burst: 1000
    max_concurrent: 50
  secondary:
    url_env: SECONDARY_RPC_URL
    rate_limit_rps: 2000
    burst: 4000
    max_concurrent: 100

l1:
  url_env: L1_RPC_URL

alerting:
  telegram:
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
    enabled: true
