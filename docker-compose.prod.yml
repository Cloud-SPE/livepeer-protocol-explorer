# Production-oriented compose shape.
# Runtime services:
# - postgres
# - livepeer-daemon
# - livepeer-api
# - optional livepeer-alert-bot
#
# Bootstrap / replay / seed import are one-shot tools, run via:
#   docker compose -f docker-compose.prod.yml run --rm livepeer-orchestrator ...
#   docker compose -f docker-compose.prod.yml run --rm livepeer-seed-migrator ...
#
# Prometheus and Alertmanager remain external per SPEC §15.1.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - livepeer-valuation-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  livepeer-daemon:
    image: livepeer-valuation-system:latest
    command:
      - livepeer-daemon
      - --env-config
      - config/env/prod.yaml
      - follow
      - --max-start-lag-blocks
      - "50000"
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHAINSTACK_RPC_URL: ${CHAINSTACK_RPC_URL}
      SECONDARY_RPC_URL: ${SECONDARY_RPC_URL}
      L1_RPC_URL: ${L1_RPC_URL}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9107:9107"

  livepeer-api:
    image: livepeer-valuation-system:latest
    command:
      - livepeer-api
      - --env-config
      - config/env/prod.yaml
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHAINSTACK_RPC_URL: ${CHAINSTACK_RPC_URL}
      SECONDARY_RPC_URL: ${SECONDARY_RPC_URL}
      L1_RPC_URL: ${L1_RPC_URL}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  livepeer-alert-bot:
    image: livepeer-valuation-system:latest
    command:
      - livepeer-alert-bot
      - --env-config
      - config/env/prod.yaml
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      ALERT_BOT_BIND: ${ALERT_BOT_BIND:-0.0.0.0:9111}
      RUST_LOG: ${RUST_LOG:-info}
    profiles: ["ops"]
    ports:
      - "9111:9111"

  livepeer-orchestrator:
    image: livepeer-valuation-system:latest
    command:
      - livepeer-orchestrator
      - --env-config
      - config/env/prod.yaml
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHAINSTACK_RPC_URL: ${CHAINSTACK_RPC_URL}
      SECONDARY_RPC_URL: ${SECONDARY_RPC_URL}
      L1_RPC_URL: ${L1_RPC_URL}
      RUST_LOG: ${RUST_LOG:-info}
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - livepeer-valuation-seed:/seed:ro

  livepeer-seed-migrator:
    image: livepeer-valuation-system:latest
    command:
      - livepeer-seed-migrator
      - --env-config
      - config/env/prod.yaml
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUST_LOG: ${RUST_LOG:-info}
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - livepeer-valuation-seed:/seed:ro

volumes:
  livepeer-valuation-pgdata:
    external: true
  livepeer-valuation-seed:
    external: true
