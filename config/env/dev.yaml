# Environment-specific config (SPEC §16.1 Layer 2). Committed.
# Values that vary per environment; secrets still live in .env.

log_level: debug

postgres:
  # Connection string is built from $POSTGRES_USER, $POSTGRES_PASSWORD,
  # $POSTGRES_DB, $POSTGRES_HOST, $POSTGRES_PORT. See .env.example.
  connection_string_env: DATABASE_URL
  pool_max_connections: 10

rpc:
  archive:
    url_env: CHAINSTACK_RPC_URL
    rate_limit_rps: 500
    burst: 1000
    max_concurrent: 50
  secondary:
    # liveinfraspe — hosted HTTP RPC, non-archive. Earlier drafts of the
    # spec assumed a self-hosted Nitro; the actual setup is two hosted RPCs.
    url_env: SECONDARY_RPC_URL
    rate_limit_rps: 2000
    burst: 4000
    max_concurrent: 100

l1:
  url_env: L1_RPC_URL

alerting:
  telegram:
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
    enabled: false  # SPEC §10.6 build-order: alert wiring last.

metrics:
  port_indexer:           9101
  port_reorg_watcher:     9102
  port_finality_watcher:  9103
  port_valuator:          9104
  port_staker:            9105
  port_api_metrics:       9106

api:
  bind: "0.0.0.0:8080"
