# SPEC §15.2 — single-host deployment, all services + Postgres on one machine.
# Prometheus + Grafana run on a separate, pre-provisioned external host (§15.1).

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # bound to localhost only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  livepeer-indexer:
    image: livepeer-protocol-explorer:latest
    build: .
    command: livepeer-indexer
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9101:9101"

  livepeer-reorg-watcher:
    image: livepeer-protocol-explorer:latest
    command: livepeer-reorg-watcher
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9102:9102"

  livepeer-finality-watcher:
    image: livepeer-protocol-explorer:latest
    command: livepeer-finality-watcher
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9103:9103"

  livepeer-valuator:
    image: livepeer-protocol-explorer:latest
    command: livepeer-valuator
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9104:9104"

  livepeer-staker:
    image: livepeer-protocol-explorer:latest
    command: livepeer-staker
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9105:9105"

  # TD-019: live-mode refresh of orchestrator_profile / broadcaster_profile.
  # Standalone follow loop around `profile-backfill`, mirroring the rollup
  # workers' --follow pattern. Cadence default 300s.
  livepeer-staker-profile-follow:
    image: livepeer-protocol-explorer:latest
    command: livepeer-staker profile-follow
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  # TD-020: tx_receipts backfill + follow. Combines historical backfill of
  # ~1.4M unique tx_hashes with steady-state follow once caught up. The
  # follow loop skip-sleeps while there are still candidates, then sleeps
  # cadence_secs (default 300s) once the table is fully materialized.
  livepeer-staker-tx-receipts-follow:
    image: livepeer-protocol-explorer:latest
    command: livepeer-staker tx-receipts-follow
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  livepeer-enricher:
    image: livepeer-protocol-explorer:latest
    command: livepeer-enricher follow
    restart: unless-stopped
    env_file: .env
    # TD-033: write resolved avatar images to the shared volume.
    environment:
      AVATAR_STORE_DIR: /opt/livepeer/avatars
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - livepeer-avatars:/opt/livepeer/avatars

  livepeer-rollups:
    image: livepeer-protocol-explorer:latest
    command: livepeer-rollups orch-payouts-daily --follow
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  # TD-018 Phase 1: backs broad-window /aggregations/events queries from
  # the daily event_metrics_daily rollup, off the raw-events scan path.
  livepeer-rollups-event-metrics:
    image: livepeer-protocol-explorer:latest
    command: livepeer-rollups event-metrics-daily --follow
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  livepeer-api:
    image: livepeer-protocol-explorer:latest
    command: livepeer-api
    restart: unless-stopped
    env_file: .env
    # TD-033: read locally-cached avatars from the shared volume.
    environment:
      AVATAR_STORE_DIR: /opt/livepeer/avatars
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - livepeer-avatars:/opt/livepeer/avatars
    ports:
      - "8080:8080"
      - "9106:9106"

  livepeer-alert-bot:
    image: livepeer-protocol-explorer:latest
    command: livepeer-alert-bot
    restart: unless-stopped
    env_file: .env
    profiles: ["ops"]
    ports:
      - "9111:9111"

  # livepeer-seed-migrator is a one-shot, not a long-running service (SPEC §15.2).
  # Run via:
  #   docker compose run --rm livepeer-seed-migrator livepeer-seed-migrator --source-sqlite /seed/sqlite-4.0.db
  livepeer-seed-migrator:
    image: livepeer-protocol-explorer:latest
    profiles: ["tools"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./seed:/seed:ro

volumes:
  postgres_data:
  # TD-033: avatar image cache shared by livepeer-enricher + livepeer-api.
  livepeer-avatars:
