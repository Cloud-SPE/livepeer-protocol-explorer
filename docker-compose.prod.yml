# Production compose. SPEC §15.2 — single-host shape.
#
# Conventions:
# - Registry image: tztcloud/livepeer-protocol-explorer:latest
# - Every service has hostname + container_name (debugging + log clarity)
# - No exposed ports — all traffic is intra-network. Front a reverse proxy
#   to publish API/metrics if needed.
# - External volumes (livepeer-valuation-pgdata, livepeer-valuation-seed)
#   and external network (livepeer-valuation) — created out-of-band so
#   `docker compose down -v` can't destroy persistent state.
# - --env-config config/env/prod.yaml on every binary.
#
# Bring up:   docker compose -f docker-compose.prod.yml up -d
#   Order is enforced: postgres → livepeer-migrate (applies pending DB
#   migrations, exits 0) → all long-running services. No manual migrate
#   step is needed; re-running `up -d` re-runs the migrator as a no-op.
# Tools:      docker compose -f docker-compose.prod.yml --profile tools run --rm livepeer-orchestrator ...
# Alerting:   docker compose -f docker-compose.prod.yml --profile ops up -d livepeer-alert-bot
#
# Prometheus / Alertmanager remain external per SPEC §15.1.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    hostname: livepeer-valuation-postgres
    container_name: livepeer-valuation-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - livepeer-valuation-pgdata:/var/lib/postgresql/data
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot schema migrator. Runs `livepeer-orchestrator migrate-only` to
  # completion, then exits 0. Every long-running service gates on this via
  # `condition: service_completed_successfully`, so nothing boots against an
  # un-migrated schema. Idempotent: a no-op when no migrations are pending.
  #
  # NOTE: the orchestrator binary constructs the archive + L1 RPC providers
  # before dispatching any subcommand, so even `migrate-only` requires
  # CHAINSTACK_RPC_URL and L1_RPC_URL to be present (the URLs are built but
  # never used by migrate-only — any valid value satisfies them).
  livepeer-migrate:
    image: tztcloud/livepeer-protocol-explorer:latest
    command:
      - livepeer-orchestrator
      - --env-config
      - config/env/prod.yaml
      - migrate-only
    restart: "no"
    hostname: livepeer-migrate
    container_name: livepeer-migrate
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHAINSTACK_RPC_URL: ${CHAINSTACK_RPC_URL}
      SECONDARY_RPC_URL: ${SECONDARY_RPC_URL}
      L1_RPC_URL: ${L1_RPC_URL}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy

  livepeer-daemon:
    image: tztcloud/livepeer-protocol-explorer:latest
    command:
      - livepeer-daemon
      - --env-config
      - config/env/prod.yaml
      - follow
      - --max-start-lag-blocks
      - "170000"
    restart: unless-stopped
    hostname: livepeer-daemon
    container_name: livepeer-daemon
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHAINSTACK_RPC_URL: ${CHAINSTACK_RPC_URL}
      SECONDARY_RPC_URL: ${SECONDARY_RPC_URL}
      L1_RPC_URL: ${L1_RPC_URL}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      livepeer-migrate:
        condition: service_completed_successfully
    # /health returns 503 when any supervised loop's heartbeat is stale or the
    # loop has been escalated (task_up=0). With restart: unless-stopped this
    # turns a wedged/broken loop into a container restart. Generous start_period
    # + retries ride out transient RPC brownouts (see http.rs thresholds).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9107/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    # ports:
    #   - "9107:9107"

  livepeer-api:
    image: tztcloud/livepeer-protocol-explorer:latest
    command:
      - livepeer-api
      - --env-config
      - config/env/prod.yaml
    restart: unless-stopped
    hostname: livepeer-api
    container_name: livepeer-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHAINSTACK_RPC_URL: ${CHAINSTACK_RPC_URL}
      SECONDARY_RPC_URL: ${SECONDARY_RPC_URL}
      L1_RPC_URL: ${L1_RPC_URL}
      RUST_LOG: ${RUST_LOG:-info}
      # CORS: comma-separated list of allowed origins, or `*` for any.
      # Default `*` keeps the API open to third-party UIs (per ask).
      # Tighten by listing specific hostnames e.g.
      #   "https://stats.example.com,https://portal.example.com"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      # Frontend runtime config (served as /config.json by the api process).
      # All optional — leave unset to use the build-time defaults baked
      # into livepeer-api itself. See routes/operational.rs::frontend_config.
      FE_BASE_API_URL: ${FE_BASE_API_URL:-}
      FE_EXPLORER_TX_BASE: ${FE_EXPLORER_TX_BASE:-}
      FE_EXPLORER_ADDRESS_BASE: ${FE_EXPLORER_ADDRESS_BASE:-}
      # TD-033: read locally-cached avatars from the shared volume. Must
      # match livepeer-enricher's AVATAR_STORE_DIR + mount path below.
      AVATAR_STORE_DIR: ${AVATAR_STORE_DIR:-/opt/livepeer/avatars}
    depends_on:
      postgres:
        condition: service_healthy
      livepeer-migrate:
        condition: service_completed_successfully
    volumes:
      - livepeer-avatars:/opt/livepeer/avatars
    # ports:
    #   - "8080:8080"

  # ── Derived-data workers (NOT inside livepeer-daemon follow). Without
  # these, the dashboard's 24 h aggregates go stale, ENS names don't refresh,
  # and report CSVs fall back to slow per-tx RPC for unknown tx fees.

  livepeer-rollups-payouts:
    image: tztcloud/livepeer-protocol-explorer:latest
    command:
      - livepeer-rollups
      - --env-config
      - config/env/prod.yaml
      - orch-payouts-daily
      - --batch-limit
      - "50000"
      - --follow
    restart: unless-stopped
    hostname: livepeer-rollups-payouts
    container_name: livepeer-rollups-payouts
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      livepeer-migrate:
        condition: service_completed_successfully

  livepeer-rollups-rewards:
    image: tztcloud/livepeer-protocol-explorer:latest
    command:
      - livepeer-rollups
      - --env-config
      - config/env/prod.yaml
      - orch-rewards-daily
      - --follow
    restart: unless-stopped
    hostname: livepeer-rollups-rewards
    container_name: livepeer-rollups-rewards
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      livepeer-migrate:
        condition: service_completed_successfully

  livepeer-rollups-tickets:
    image: tztcloud/livepeer-protocol-explorer:latest
    command:
      - livepeer-rollups
      - --env-config
      - config/env/prod.yaml
      - tickets-daily
      - --follow
    restart: unless-stopped
    hostname: livepeer-rollups-tickets
    container_name: livepeer-rollups-tickets
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      livepeer-migrate:
        condition: service_completed_successfully

  # TD-018: backs broad-window /aggregations/events queries from the
  # event_metrics_daily rollup, off the raw-events scan path.
  livepeer-rollups-event-metrics:
    image: tztcloud/livepeer-protocol-explorer:latest
    command:
      - livepeer-rollups
      - --env-config
      - config/env/prod.yaml
      - event-metrics-daily
      - --batch-limit
      - "50000"
      - --follow
    restart: unless-stopped
    hostname: livepeer-rollups-event-metrics
    container_name: livepeer-rollups-event-metrics
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      livepeer-migrate:
        condition: service_completed_successfully

  # ENS name + avatar resolution for new addresses. L1 (Ethereum mainnet) only.
  livepeer-enricher:
    image: tztcloud/livepeer-protocol-explorer:latest
    command:
      - livepeer-enricher
      - --env-config
      - config/env/prod.yaml
      - follow
    restart: unless-stopped
    hostname: livepeer-enricher
    container_name: livepeer-enricher
    environment:
      DATABASE_URL: ${DATABASE_URL}
      L1_RPC_URL: ${L1_RPC_URL}
      RUST_LOG: ${RUST_LOG:-info}
      # TD-033: write resolved avatar images to the shared volume. Must
      # match livepeer-api's AVATAR_STORE_DIR + mount path.
      AVATAR_STORE_DIR: ${AVATAR_STORE_DIR:-/opt/livepeer/avatars}
    depends_on:
      postgres:
        condition: service_healthy
      livepeer-migrate:
        condition: service_completed_successfully
    volumes:
      - livepeer-avatars:/opt/livepeer/avatars

  # TD-020: materializes tx receipts (gas, fee, status) into tx_receipts so
  # report endpoints don't fan out per-tx eth_getTransactionReceipt calls.
  livepeer-staker-tx-receipts:
    image: tztcloud/livepeer-protocol-explorer:latest
    command:
      - livepeer-staker
      - --env-config
      - config/env/prod.yaml
      - tx-receipts-follow
      - --batch-limit
      - "5000"
      - --concurrency
      - "8"
      - --cadence-secs
      - "30"
    restart: unless-stopped
    hostname: livepeer-staker-tx-receipts
    container_name: livepeer-staker-tx-receipts
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHAINSTACK_RPC_URL: ${CHAINSTACK_RPC_URL}
      SECONDARY_RPC_URL: ${SECONDARY_RPC_URL}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      livepeer-migrate:
        condition: service_completed_successfully

  # ── Read-only production diagnostics (MCP server) ──────────────────
  # A read-only debugging surface: an operator connects Claude to it and asks
  # "why is indexing stalled / pricing slow / reports late". It reads the DB
  # (SELECT-only diag_ro role), scrapes the workers' /metrics, and reads
  # container state + logs through the GET-only docker-socket-proxy below.
  #
  # SECURITY:
  # - Never mount the raw docker socket here — go through docker-proxy.
  # - Port is bound to host loopback only; reach it from a laptop via an SSH
  #   tunnel:  ssh -L 9200:127.0.0.1:9200 <host>  then point the MCP client at
  #   http://127.0.0.1:9200/mcp with the bearer token.
  # - Provision the diag_ro role once (see scripts/diag_ro_role.sql).

  # GET-only Docker Engine API proxy. CONTAINERS=1 exposes /containers/json and
  # /containers/{id}/logs; POST/EXEC stay 0 so create/kill/exec are refused at
  # the proxy regardless of what the diag server requests.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    restart: unless-stopped
    hostname: docker-proxy
    container_name: docker-proxy
    environment:
      CONTAINERS: 1
      POST: 0
      EXEC: 0
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      INFO: 0
      PING: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  livepeer-mcp-diag:
    image: tztcloud/livepeer-protocol-explorer:latest
    command:
      - livepeer-mcp-diag
      - --env-config
      - config/env/prod.yaml
      - --transport
      - http
    restart: unless-stopped
    hostname: livepeer-mcp-diag
    container_name: livepeer-mcp-diag
    environment:
      # Dedicated read-only role — NOT the workers' read-write DATABASE_URL.
      DIAG_DATABASE_URL: ${DIAG_DATABASE_URL}
      DIAG_BEARER_TOKEN: ${DIAG_BEARER_TOKEN}
      DOCKER_HOST: tcp://docker-proxy:2375
      DIAG_METRICS_ENDPOINTS: ${DIAG_METRICS_ENDPOINTS:-http://livepeer-daemon:9107/metrics,http://livepeer-enricher:9112/metrics,http://livepeer-api:8080/metrics}
      # Required when reached through a reverse proxy / Cloudflare tunnel: the
      # public Host header must be allowlisted (or set to `*`) or /mcp returns
      # 403 (rmcp DNS-rebinding protection). Harmless for loopback/SSH access.
      DIAG_ALLOWED_HOSTS: ${DIAG_ALLOWED_HOSTS:-}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      # Host loopback only — reach via SSH tunnel, never publish publicly.
      - "127.0.0.1:9200:9200"
    depends_on:
      postgres:
        condition: service_healthy
      livepeer-migrate:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_started

  # ── Optional: Telegram alerting (enable with --profile ops) ────────
  # livepeer-alert-bot:
  #   image: tztcloud/livepeer-protocol-explorer:latest
  #   command:
  #     - livepeer-alert-bot
  #     - --env-config
  #     - config/env/prod.yaml
  #   restart: unless-stopped
  #   hostname: livepeer-alert-bot
  #   container_name: livepeer-alert-bot
  #   environment:
  #     DATABASE_URL: ${DATABASE_URL}
  #     TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
  #     TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
  #     ALERT_BOT_BIND: ${ALERT_BOT_BIND:-0.0.0.0:9111}
  #     RUST_LOG: ${RUST_LOG:-info}
  #   profiles: ["ops"]
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     livepeer-migrate:
  #       condition: service_completed_successfully

  # ── One-shot tools (enable with --profile tools run --rm) ──────────
  #
  # Use this for ad-hoc `bootstrap`, `replay`, etc. (`migrate-only` now runs
  # automatically via the livepeer-migrate service above). The container
  # exits when the subcommand finishes — do NOT include `restart:` here.
  #
  # Examples:
  #   docker compose -f docker-compose.prod.yml --profile tools \
  #     run --rm livepeer-orchestrator --env-config config/env/prod.yaml \
  #     bootstrap --to-block 250000000
  livepeer-orchestrator:
    image: tztcloud/livepeer-protocol-explorer:latest
    entrypoint: ["livepeer-orchestrator"]
    hostname: livepeer-orchestrator
    container_name: livepeer-orchestrator
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHAINSTACK_RPC_URL: ${CHAINSTACK_RPC_URL}
      SECONDARY_RPC_URL: ${SECONDARY_RPC_URL}
      L1_RPC_URL: ${L1_RPC_URL}
      RUST_LOG: ${RUST_LOG:-info}
      # Optional override; default `/opt/livepeer/migrations` is baked into
      # the image by Dockerfile and matches resolve_migrations_path().
      # MIGRATIONS_PATH: /opt/livepeer/migrations
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - livepeer-valuation-seed:/seed:ro

  # livepeer-seed-migrator:
  #   image: tztcloud/livepeer-protocol-explorer:latest
  #   command:
  #     - livepeer-seed-migrator
  #     - --env-config
  #     - config/env/prod.yaml
  #   hostname: livepeer-seed-migrator
  #   container_name: livepeer-seed-migrator
  #   environment:
  #     DATABASE_URL: ${DATABASE_URL}
  #     RUST_LOG: ${RUST_LOG:-info}
  #   profiles: ["tools"]
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   volumes:
  #     - livepeer-valuation-seed:/seed:ro

volumes:
  livepeer-valuation-pgdata:
    external: true
  livepeer-valuation-seed:
    external: true
  # TD-033: avatar image cache shared by livepeer-enricher (writer) and
  # livepeer-api (reader). Not external: the cache is fully rebuildable by
  # the enricher, so it's fine for `down -v` to discard it (the next sweep
  # re-resolves and repopulates).
  livepeer-avatars:

networks:
  default:
    name: livepeer-valuation
    external: true
