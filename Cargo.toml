[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/livepeer-indexer",
    "crates/livepeer-reorg-watcher",
    "crates/livepeer-finality-watcher",
    "crates/livepeer-valuator",
    "crates/livepeer-staker",
    "crates/livepeer-enricher",
    "crates/livepeer-rollups",
    "crates/livepeer-api",
    "crates/livepeer-seed-migrator",
    "crates/livepeer-orchestrator",
    "crates/livepeer-daemon",
    "crates/livepeer-alert-bot",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
license = "UNLICENSED"
publish = false

# All versions pinned exactly. Bumps move through PR review (SPEC §4.4).
[workspace.dependencies]
anyhow = "=1.0.95"
thiserror = "=2.0.11"
tokio = { version = "=1.43.0", features = ["full"] }
futures = "=0.3.31"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "json"] }
clap = { version = "=4.5.27", features = ["derive", "env"] }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
serde_yaml = "=0.9.34"
sqlx = { version = "=0.8.3", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "macros", "migrate", "json", "uuid", "chrono", "bigdecimal"] }
axum = "=0.8.1"
tower = "=0.5.2"
tower-http = { version = "=0.6.2", features = ["trace", "cors", "fs"] }
prometheus = "=0.13.4"
alloy = { version = "=0.11.1", features = ["full"] }
reqwest = { version = "=0.12.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "=0.10.8"
hex = "=0.4.3"
chrono = { version = "=0.4.39", features = ["serde"] }
bigdecimal = { version = "=0.4.7", features = ["serde"] }
utoipa = { version = "=5.4.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "=9.0.2", features = ["axum"] }
livepeer-core = { path = "crates/core" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev]
debug = 1
